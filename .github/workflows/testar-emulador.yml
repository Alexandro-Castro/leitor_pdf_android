name: Testar no emulador

# Roda o app em emuladores (Android 8 e Android 15), tira capturas de tela e guarda os
# registros. Dispara ao enviar para o ramo "teste" ou manualmente na aba Actions.
on:
  push:
    branches: [teste]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  emulador:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [26, 35]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Compilar
        run: |
          mkdir -p resultado
          set -o pipefail
          ./gradlew --no-daemon assembleDebug lintDebug 2>&1 | tee resultado/compilacao.txt

      - name: Relatório do lint
        if: always()
        run: cp app/build/reports/lint-results-debug.txt resultado/lint.txt 2>/dev/null || true

      - name: Ativar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: PDF de exemplo
        run: python3 .github/testes/gerar_pdf.py exemplo.pdf

      - name: Rodar no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          script: bash .github/testes/roteiro.sh

      - name: Guardar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-${{ matrix.api }}
          path: resultado/

  publicar:
    needs: emulador
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: resultados

      - name: Enviar para o ramo resultados-teste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p resultados
          cd resultados
          echo "Teste do commit ${{ github.sha }}" > LEIAME.txt
          git init -q -b resultados
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Resultados do teste de ${{ github.sha }}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" resultados:resultados-teste
